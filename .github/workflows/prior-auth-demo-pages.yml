name: Prior Auth Demo Validation

on:
  pull_request:
    paths:
      - 'patterns/prior-authorization-agent/demo/**'
      - '.github/workflows/prior-auth-demo-pages.yml'
  push:
    branches: [main, feature/prior-auth-reliability-gates]
    paths:
      - 'patterns/prior-authorization-agent/demo/**'
      - '.github/workflows/prior-auth-demo-pages.yml'
  workflow_dispatch:

# The public demo is deployed through Vercel. Keep this workflow as a cheap,
# provider-neutral validation that the static bundle contains its entry point
# and referenced assets. This avoids requiring GitHub Pages repository settings.
jobs:
  validate-static-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static demo bundle
        run: |
          set -euo pipefail
          demo=patterns/prior-authorization-agent/demo
          test -s "$demo/index.html"
          test -s "$demo/styles.css"
          test -s "$demo/app.js"
          grep -q 'styles.css' "$demo/index.html"
          grep -q 'app.js' "$demo/index.html"
